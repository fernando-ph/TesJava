version: '2.8'



services:

 
  db:
    image: mysql:8.0
    container_name: simpanbuku-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: simpanbuku_db
      MYSQL_USER: simpanbuku_user
      MYSQL_PASSWORD: simpanbuku_pass
    ports:
      - "3307:3306"   
    volumes:
      - db-data:/var/lib/mysql   
    networks:
      - simpanbuku-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

   app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simpanbuku-app
    ports:
      - "8080:8080"
    environment:
     
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/simpanbuku_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: simpanbuku_user
      SPRING_DATASOURCE_PASSWORD: simpanbuku_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    volumes:
      - uploads-data:/app/uploads   
    depends_on:
      db:
        condition: service_healthy  
    networks:
      - simpanbuku-net
    restart: on-failure

# ----------------------------------------------------------
# VOLUMES — Data persisten di luar container lifecycle
# ----------------------------------------------------------
: # file upload


  simpanbuku-net:
    driver: bridge
